plugins { id 'com.android.application' }

android { namespace 'com.theatrle.app'; compileSdk 36; buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.theatrle.app'; minSdk 23; targetSdk 36; versionCode 1; versionName '1.0'
        testInstrumentationRunner 'com.theatrle.app.PosterChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Keep the user's manual-testing location synchronized after every successful build.
def testingApk = tasks.register('updateManualTestingApk', Copy) {
    dependsOn('packageDebug')
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(layout.buildDirectory.dir('intermediates/apk/debug'))
}
tasks.configureEach {
    if (name == 'assembleDebug') dependsOn(testingApk)
}
